<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<title>El Arca</title>
<style>
  :root { --cielo1: #8fd3ff; --cielo2: #e0f6ff; --pasto: #7bd389; --fg: #1f2937; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; color: var(--fg); background: var(--cielo2); }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; }

  #barra { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; gap: 8px; align-items: center; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none; }
  #barra > * { pointer-events: auto; }
  .chip { background: #ffffffd9; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 16px; box-shadow: 0 2px 0 #0001; }
  .espacio { flex: 1; }
  #candado.cargando { animation: llenar 3s linear forwards; }
  @keyframes llenar { from { box-shadow: inset 0 0 0 0 #0003; } to { box-shadow: inset 0 0 0 24px #0003; } }

  .pantalla { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; padding: 64px 16px 16px; overflow-y: auto; }
  .pantalla.activa { display: flex; }
  h1 { font-size: clamp(26px, 6vmin, 44px); text-shadow: 0 2px 0 #fff; text-align: center; }
  h2 { font-size: clamp(22px, 5vmin, 34px); text-align: center; margin-bottom: 8px; }

  /* Inicio: el arca */
  #inicio { background: linear-gradient(var(--cielo1), var(--cielo2) 62%, #5dade2 62%, #2e86c1); justify-content: center; gap: 12px; }
  #arca { width: min(92vw, 560px); background: none; }
  #arca svg { width: 100%; height: auto; display: block; }
  #arca.sacude { animation: sacude .4s; }
  .tabla.nueva { animation: caer .45s ease-out; transform-box: fill-box; }
  @keyframes caer { from { transform: translateY(-40px); opacity: 0; } }
  #msgArca { font-weight: 700; font-size: clamp(16px, 3.6vmin, 22px); text-align: center; background: #ffffffd9; padding: 8px 14px; border-radius: 14px; }
  .fila-botones { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .grande { background: #22c55e; color: #fff; font-size: clamp(22px, 5vmin, 34px); font-weight: 800; padding: 16px 36px; border-radius: 24px; box-shadow: 0 6px 0 #15803d; }
  .medio { background: #fff; font-size: clamp(16px, 3.6vmin, 22px); font-weight: 700; padding: 10px 16px; border-radius: 20px; box-shadow: 0 5px 0 #0002; display: flex; align-items: center; gap: 8px; }
  .grande:active, .medio:active, .opcion:active { transform: translateY(3px); }
  .pulsa { animation: pulsa 1s infinite; }
  @keyframes pulsa { 50% { transform: scale(1.08); } }

  /* Mundo para explorar */
  #mundo { padding: 0; background: linear-gradient(var(--cielo1) 0 22%, var(--pasto) 22% 100%); overflow: hidden; }
  #campo { position: absolute; inset: 0; }
  .arbusto { position: absolute; transform: translate(-50%, -50%); font-size: clamp(56px, 13vmin, 110px); background: none; line-height: 1; filter: drop-shadow(0 6px 0 #0002); }
  .arbusto.sacude { animation: sacudeA .4s; }
  @keyframes sacudeA { 25% { transform: translate(-50%, -50%) rotate(-8deg); } 75% { transform: translate(-50%, -50%) rotate(8deg); } }
  @keyframes sacude { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  .asoma { position: absolute; transform: translate(-50%, -115%); font-size: clamp(40px, 9vmin, 72px); animation: asoma .4s ease-out; pointer-events: none; }
  @keyframes asoma { from { transform: translate(-50%, -30%) scale(.3); opacity: 0; } }
  #explorador { position: absolute; transform: translate(-50%, -60%); transition: left .6s ease-in-out, top .6s ease-in-out; pointer-events: none; z-index: 5; }
  #bArca { position: absolute; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; }

  /* Personaje */
  .avatar { position: relative; display: inline-grid; place-items: center; border-radius: 50%; background: var(--col); box-shadow: 0 4px 0 #0002; flex: none; }
  .avatar .cara { line-height: 1; }
  .avatar .gorro { position: absolute; left: 50%; top: 0; transform: translate(-50%, -45%); line-height: 1; }
  #personaje, #album { background: linear-gradient(var(--cielo1), var(--cielo2)); gap: 10px; }
  .grupo { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 640px; }
  .item { width: 72px; height: 72px; border-radius: 18px; background: #fff; font-size: 40px; display: grid; place-items: center; box-shadow: 0 4px 0 #0002; position: relative; }
  .item.sel { outline: 4px solid #22c55e; }
  .item.bloq { opacity: .45; }
  .item .precio { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 12px; font-weight: 800; }
  h3 { font-size: 18px; margin-top: 8px; }

  /* Álbum */
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; width: min(100%, 720px); }
  .ficha { background: #fff; border-radius: 18px; padding: 8px; text-align: center; box-shadow: 0 4px 0 #0002; }
  .ficha .emo { font-size: 48px; line-height: 1.1; }
  .ficha.no .emo { filter: brightness(0); opacity: .2; }
  .ficha small { display: block; font-weight: 700; font-size: 13px; }

  /* Capas: retos, festejo, final, ajustes */
  .capa { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: #0007; padding: 16px; }
  .capa.abierta { display: grid; }
  .tarjeta { background: #fff; border-radius: 28px; padding: 20px; width: min(94vw, 660px); max-height: 94vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; box-shadow: 0 10px 0 #0003; }
  .animal-grande { font-size: clamp(80px, 22vmin, 150px); line-height: 1; }
  .palabra { font-size: clamp(34px, 9vmin, 60px); font-weight: 800; letter-spacing: .04em; }
  .palabra b { color: #ef4444; text-decoration: underline; }
  #retoPregunta { font-size: clamp(18px, 4.5vmin, 26px); font-weight: 700; text-align: center; }
  #retoOpciones { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .opcion { min-width: clamp(80px, 20vmin, 120px); min-height: clamp(80px, 20vmin, 120px); border-radius: 24px; background: #e0f2fe; font-size: clamp(40px, 11vmin, 72px); font-weight: 800; box-shadow: 0 6px 0 #0284c733; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; }
  .opcion .puntos { font-size: clamp(12px, 3vmin, 18px); letter-spacing: 2px; color: #0284c7; }
  .opcion.mal { opacity: .35; animation: no .3s; }
  @keyframes no { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .opcion.pista { animation: pulsa .8s infinite; background: #fef08a; }
  .opcion.bien { background: #86efac; }
  .contables { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .contable { font-size: clamp(44px, 11vmin, 76px); background: none; position: relative; line-height: 1; }
  .contable .num { position: absolute; right: -4px; top: -4px; background: #ef4444; color: #fff; font-size: 16px; font-weight: 800; border-radius: 999px; min-width: 26px; height: 26px; display: grid; place-items: center; }
  .oir { position: absolute; right: 12px; top: 12px; background: #f1f5f9; }
  .pareja { font-size: clamp(70px, 18vmin, 120px); animation: salta .5s infinite alternate; }
  @keyframes salta { to { transform: translateY(-12px); } }
  .texto-grande { font-size: clamp(20px, 5vmin, 30px); font-weight: 800; text-align: center; }

  #final { background: linear-gradient(#4b5563, #9ca3af); overflow: hidden; transition: background 2s; }
  #final.sol { background: linear-gradient(#8fd3ff, #e0f6ff); }
  #final .contenido { display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1; width: min(94vw, 600px); }
  #arcoiris { width: min(80vw, 480px); aspect-ratio: 2; opacity: 0; transition: opacity 2.5s; margin-bottom: -18%;
    background: radial-gradient(50% 100% at 50% 100%, transparent 50%, #8b5cf6 50% 58%, #3b82f6 58% 66%, #22c55e 66% 74%, #facc15 74% 82%, #f97316 82% 90%, #ef4444 90% 98%, transparent 98%); }
  #final.sol #arcoiris { opacity: 1; }
  #final .arca-final { width: min(80vw, 480px); }
  #historia { background: #ffffffe6; border-radius: 18px; padding: 12px 16px; font-size: clamp(16px, 3.8vmin, 21px); font-weight: 600; line-height: 1.4; text-align: center; opacity: 0; transition: opacity 1s; }
  #final.sol #historia { opacity: 1; }
  .gota { position: absolute; top: -20px; width: 2px; height: 18px; background: #bfdbfe; animation: cae linear infinite; }
  #final.sol .gota { display: none; }
  @keyframes cae { to { transform: translateY(110vh); } }

  #panel .tarjeta { align-items: stretch; }
  #panel label { font-weight: 600; }
  #panel input[type=text] { font: inherit; padding: 10px 12px; border: 1px solid #0002; border-radius: 12px; width: 100%; }
  .opc { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .opc input { width: 22px; height: 22px; }
  .boton { background: #f1f5f9; border-radius: 999px; padding: 10px 16px; font-weight: 700; }
  .boton.principal { background: #1f2937; color: #fff; }
  .boton.peligro { background: #fee2e2; color: #b91c1c; }
  /* Construir el arca */
  #obra { padding: 0; background: #8fd3ff; overflow: hidden; }
  #lienzoObra { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #mision { position: absolute; top: max(56px, calc(env(safe-area-inset-top) + 50px)); left: 50%; transform: translateX(-50%); width: min(94vw, 560px); background: #fffffff0; border-radius: 18px; padding: 8px 52px 8px 14px; box-shadow: 0 4px 0 #0002; z-index: 4; }
  #mision .ref { font-size: 12px; font-weight: 800; color: #b45309; }
  #mision .tit { font-size: clamp(15px, 3.6vmin, 20px); font-weight: 800; }
  .barraAv { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .barraAv span { display: block; height: 100%; background: #22c55e; width: 0; transition: width .3s; }
  #mision .cuenta { font-size: 13px; font-weight: 700; color: #475569; margin-top: 2px; }
  #misionOir { position: absolute; right: 8px; top: 8px; }
  #mandos { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; z-index: 4; pointer-events: none; }
  .grupoMando { display: flex; gap: 10px; pointer-events: auto; }
  .grupoMando.columna { flex-direction: column; gap: 8px; }
  .grupoMando button { width: clamp(60px, 15vmin, 84px); height: clamp(60px, 15vmin, 84px); border-radius: 22px; background: #ffffffe0; font-size: clamp(26px, 7vmin, 38px); font-weight: 800; box-shadow: 0 5px 0 #0003; touch-action: none; }
  .grupoMando.columna button { width: 48px; height: 48px; font-size: 22px; border-radius: 16px; }
  .grupoMando button.on { transform: translateY(3px); background: #fef08a; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111d; color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; z-index: 40; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; max-width: 90vw; }
  #toast.ver { opacity: 1; }
</style>
</head>
<body>
<header id="barra">
  <button id="bInicio" class="chip" title="Inicio">🚢</button>
  <span class="chip" id="cEstrellas">⭐ 0</span>
  <span class="chip" id="cTablas">🪵 0/10</span>
  <span class="espacio"></span>
  <button id="candado" class="chip" title="Mantén presionado 3 segundos">🔒</button>
</header>

<section id="inicio" class="pantalla activa">
  <h1 id="titulo">El Arca</h1>
  <button id="arca" aria-label="Arca"></button>
  <p id="msgArca"></p>
  <div class="fila-botones">
    <button id="bJugar" class="grande">🧭 <span></span></button>
    <button id="bConstruir" class="grande" style="background:#f59e0b;box-shadow:0 6px 0 #b45309">🔨 <span></span></button>
  </div>
  <div class="fila-botones">
    <button id="bPersonaje" class="medio"><span class="mini"></span><span class="lbl"></span></button>
    <button id="bAlbum" class="medio">🏆 <span class="lbl"></span></button>
  </div>
</section>

<section id="mundo" class="pantalla">
  <div id="campo"></div>
  <div id="explorador"></div>
  <button id="bArca" class="medio">🚢 <span class="lbl"></span></button>
</section>

<section id="obra" class="pantalla">
  <canvas id="lienzoObra"></canvas>
  <div id="mision">
    <div class="ref"></div><div class="tit"></div>
    <div class="barraAv"><span></span></div><div class="cuenta"></div>
    <button id="misionOir" class="chip">🔊</button>
  </div>
  <div id="mandos">
    <div class="grupoMando"><button data-k="izq" aria-label="Izquierda">◀</button><button data-k="der" aria-label="Derecha">▶</button></div>
    <div class="grupoMando columna"><button id="bVista" title="Ver toda el arca">🔭</button><button id="bIrRescatar" title="Rescatar animales">🧭</button></div>
    <div class="grupoMando"><button data-k="abajo" aria-label="Bajar">⬇</button><button data-k="arriba" aria-label="Saltar o subir">⬆</button></div>
  </div>
</section>

<section id="personaje" class="pantalla">
  <h2 class="lbl-personaje"></h2>
  <div id="vistaAvatar"></div>
  <h3 class="lbl-cara"></h3><div class="grupo" id="gCaras"></div>
  <h3 class="lbl-gorro"></h3><div class="grupo" id="gGorros"></div>
  <h3 class="lbl-color"></h3><div class="grupo" id="gColores"></div>
</section>

<section id="album" class="pantalla">
  <h2 id="tituloAlbum"></h2>
  <div class="rejilla" id="rejilla"></div>
</section>

<div id="reto" class="capa"><div class="tarjeta">
  <button class="chip oir" id="retoOir">🔊</button>
  <div id="retoVer"></div>
  <div id="retoPregunta"></div>
  <div id="retoOpciones"></div>
</div></div>

<div id="festejo" class="capa"><div class="tarjeta">
  <div class="pareja" id="festejoPareja"></div>
  <div class="texto-grande" id="festejoTexto"></div>
  <div class="texto-grande" id="festejoEstrellas"></div>
  <button class="grande" id="festejoSeguir">👍</button>
</div></div>

<div id="final" class="capa"><div class="contenido">
  <div id="arcoiris"></div>
  <div class="arca-final" id="arcaFinal"></div>
  <p id="historia"></p>
  <button class="grande" id="bNuevaArca"></button>
</div></div>

<div id="panel" class="capa"><div class="tarjeta">
  <h2>⚙️ Ajustes para adultos</h2>
  <label for="nombre">Nombre del niño o niña (opcional, solo se guarda en este aparato)</label>
  <input type="text" id="nombre" maxlength="20" autocomplete="off">
  <h3>Idioma / Language</h3>
  <div id="pIdioma"></div>
  <h3>Nivel</h3>
  <div id="pNivel"></div>
  <p style="color:#64748b;font-size:14px">El nivel sube solo al terminar cada arca. Fácil: letras con 2 opciones y contar hasta 3. Medio: 3 opciones, hasta 5. Difícil: 4 opciones, hasta 8, sin resaltar la letra.</p>
  <button class="boton peligro" id="bReiniciar">Borrar el progreso</button>
  <button class="boton principal" id="bCerrarPanel">Listo 🔒</button>
</div></div>

<div id="toast"></div>

<script>
// ---------- Datos ----------
const ANIMALES = [
  { id: 'leon',     emo: '🦁', g: 'm', es: ['León', 'leones'],         en: ['Lion', 'lions'] },
  { id: 'elefante', emo: '🐘', g: 'm', es: ['Elefante', 'elefantes'],  en: ['Elephant', 'elephants'] },
  { id: 'jirafa',   emo: '🦒', g: 'f', es: ['Jirafa', 'jirafas'],      en: ['Giraffe', 'giraffes'] },
  { id: 'mono',     emo: '🐒', g: 'm', es: ['Mono', 'monos'],          en: ['Monkey', 'monkeys'] },
  { id: 'tigre',    emo: '🐯', g: 'm', es: ['Tigre', 'tigres'],        en: ['Tiger', 'tigers'] },
  { id: 'oso',      emo: '🐻', g: 'm', es: ['Oso', 'osos'],            en: ['Bear', 'bears'] },
  { id: 'perro',    emo: '🐶', g: 'm', es: ['Perro', 'perros'],        en: ['Dog', 'dogs'] },
  { id: 'gato',     emo: '🐱', g: 'm', es: ['Gato', 'gatos'],          en: ['Cat', 'cats'] },
  { id: 'vaca',     emo: '🐮', g: 'f', es: ['Vaca', 'vacas'],          en: ['Cow', 'cows'] },
  { id: 'cerdo',    emo: '🐷', g: 'm', es: ['Cerdo', 'cerdos'],        en: ['Pig', 'pigs'] },
  { id: 'pato',     emo: '🦆', g: 'm', es: ['Pato', 'patos'],          en: ['Duck', 'ducks'] },
  { id: 'conejo',   emo: '🐰', g: 'm', es: ['Conejo', 'conejos'],      en: ['Rabbit', 'rabbits'] },
  { id: 'caballo',  emo: '🐴', g: 'm', es: ['Caballo', 'caballos'],    en: ['Horse', 'horses'] },
  { id: 'oveja',    emo: '🐑', g: 'f', es: ['Oveja', 'ovejas'],        en: ['Sheep', 'sheep'] },
  { id: 'rana',     emo: '🐸', g: 'f', es: ['Rana', 'ranas'],          en: ['Frog', 'frogs'] },
  { id: 'tortuga',  emo: '🐢', g: 'f', es: ['Tortuga', 'tortugas'],    en: ['Turtle', 'turtles'] },
  { id: 'pinguino', emo: '🐧', g: 'm', es: ['Pingüino', 'pingüinos'],  en: ['Penguin', 'penguins'] },
  { id: 'zorro',    emo: '🦊', g: 'm', es: ['Zorro', 'zorros'],        en: ['Fox', 'foxes'] },
  { id: 'cebra',    emo: '🦓', g: 'f', es: ['Cebra', 'cebras'],        en: ['Zebra', 'zebras'] },
  { id: 'buho',     emo: '🦉', g: 'm', es: ['Búho', 'búhos'],          en: ['Owl', 'owls'] },
  { id: 'koala',    emo: '🐨', g: 'm', es: ['Koala', 'koalas'],        en: ['Koala', 'koalas'] },
  { id: 'raton',    emo: '🐭', g: 'm', es: ['Ratón', 'ratones'],       en: ['Mouse', 'mice'] },
  { id: 'gallina',  emo: '🐔', g: 'f', es: ['Gallina', 'gallinas'],    en: ['Hen', 'hens'] },
];
// [emoji, estrellas necesarias]: los premios se desbloquean, no se gastan
const CARAS   = [['👦', 0], ['👦🏻', 0], ['👦🏽', 0], ['👦🏿', 0], ['🧒', 0], ['🤖', 10], ['🦸', 20], ['🐵', 30]];
const GORROS  = [['', 0], ['🧢', 0], ['🎩', 5], ['🤠', 10], ['🎓', 15], ['⛑️', 20], ['👑', 30]];
const COLORES = ['#4dabf7', '#ff6b6b', '#51cf66', '#fcc419', '#cc5de8', '#ff922b'];
const TABLAS_ARCA = 10;
const LETRAS = 'ABCDEFGHIJLMNOPRSTUVZ';   // sin K, Ñ, Q, W, X, Y para no confundir al empezar

// ---------- Estado guardado (si el navegador lo permite) ----------
const DEF = { estrellas: 0, coleccion: {}, madera: 30, mision: 0, obra: '', nivel: 1, arcas: 0,
              avatar: { cara: '👦', gorro: '🧢', color: '#4dabf7' }, nombre: '', idioma: 'ambos', bienvenida: false };
let E;
try { E = JSON.parse(localStorage.getItem('arca.estado')) || {}; } catch { E = {}; }
// Versión anterior: las tablas de 10 se convierten en madera para el arca grande
if (E.madera === undefined && (E.tablas || E.pendientes)) E.madera = 30 + ((E.tablas || 0) + (E.pendientes || 0)) * 25;
delete E.tablas; delete E.pendientes;
E = { ...JSON.parse(JSON.stringify(DEF)), ...E, avatar: { ...DEF.avatar, ...(E.avatar || {}) } };
function guardar() { try { localStorage.setItem('arca.estado', JSON.stringify(E)); } catch {} }

// ---------- Textos y voz ----------
const T = (es, en) => E.idioma === 'es' ? es : E.idioma === 'en' ? en : `${es} · ${en}`;
const lenguasMsg = () => E.idioma === 'ambos' ? ['es', 'en'] : [E.idioma];
function vozDe(l) {
  const vs = speechSynthesis.getVoices(), pref = l === 'es' ? ['es-mx', 'es-us', 'es'] : ['en-us', 'en-gb', 'en'];
  for (const x of pref) { const v = vs.find(v => v.lang.replace('_', '-').toLowerCase().startsWith(x)); if (v) return v; }
}
function decir(partes) {   // partes: [{ l: 'es' | 'en', t: 'texto' }]
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  for (const { l, t } of partes) {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = l === 'es' ? 'es-MX' : 'en-US'; u.rate = 0.9; u.pitch = 1.1;
    const v = vozDe(l); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
}
const di = (es, en) => decir(lenguasMsg().map(l => ({ l, t: l === 'es' ? es : en })));
if ('speechSynthesis' in window) speechSynthesis.getVoices();
const sinAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const nombreNino = () => E.nombre.trim();

// ---------- Sonidos ----------
let ac;
function audio() { ac ??= new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); return ac; }
function tono(f, t0, dur, tipo = 'sine', vol = 0.18) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = tipo; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  bien:     () => [523, 659, 784, 1047].forEach((f, i) => tono(f, i * 0.09, 0.3, 'triangle')),
  casi:     () => { tono(392, 0, 0.2, 'sine', 0.12); tono(349, 0.16, 0.3, 'sine', 0.12); },
  martillo: () => { tono(140, 0, 0.12, 'square', 0.12); tono(90, 0.02, 0.15, 'triangle', 0.2); },
  pop:      () => tono(880, 0, 0.1, 'sine', 0.15),
  paso:     () => { tono(300, 0, 0.06, 'triangle', 0.08); tono(260, 0.2, 0.06, 'triangle', 0.08); },
  fanfarria:() => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tono(f, i * 0.15, 0.4, 'triangle', 0.16)),
};

const mezclar = a => { for (let i = a.length - 1; i > 0; i--) { const j = azar(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- El arca (dibujo) ----------
function svgArca(tablas, completa, nueva) {
  let s = '<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">';
  for (let i = 0; i < TABLAS_ARCA; i++) {
    const y = 150 - i * 7, x1 = 60 - i * 3.5, x2 = 240 + i * 3.5, hecha = i < tablas;
    s += `<rect class="tabla${hecha && nueva && i === tablas - 1 ? ' nueva' : ''}" x="${x1}" y="${y}" width="${x2 - x1}" height="6" rx="3"
      fill="${hecha ? (i % 2 ? '#a0522d' : '#8b4513') : 'none'}" stroke="${hecha ? '#5c2e0e' : '#ffffffcc'}" stroke-width="1.2" ${hecha ? '' : 'stroke-dasharray="4 3"'}/>`;
  }
  const rescatados = ANIMALES.filter(a => E.coleccion[a.id]).map(a => a.emo);
  if (completa) {
    s += '<polygon points="92,58 150,28 208,58" fill="#b45309" stroke="#5c2e0e"/><rect x="100" y="56" width="100" height="31" fill="#deb887" stroke="#5c2e0e"/>';
    rescatados.slice(0, 4).forEach((e, k) => { s += `<rect x="${106 + k * 23}" y="62" width="19" height="19" rx="4" fill="#fff8"/><text x="${115.5 + k * 23}" y="77" font-size="14" text-anchor="middle">${e}</text>`; });
  } else if (tablas) {
    const yTop = 150 - (tablas - 1) * 7;
    rescatados.slice(-6).forEach((e, k, arr) => { s += `<text x="${150 + (k - (arr.length - 1) / 2) * 20}" y="${yTop - 2}" font-size="16" text-anchor="middle">${e}</text>`; });
  }
  s += '<path d="M0 162 Q 25 154 50 162 T 100 162 T 150 162 T 200 162 T 250 162 T 300 162 V200 H0 Z" fill="#3b82f6" opacity=".85"/></svg>';
  return s;
}

const campo = $('campo'), explorador = $('explorador');
let arbustos = [], ocupado = false, pos = { x: 50, y: 86 };
function pintarExplorador() {
  explorador.innerHTML = avatarHTML(E.avatar, Math.max(56, Math.min(innerWidth, innerHeight) * 0.13));
  explorador.style.left = pos.x + '%'; explorador.style.top = pos.y + '%';
}
function caminar(x, y) {
  const av = explorador.querySelector('.avatar');
  if (av) av.style.transform = x < pos.x ? 'scaleX(-1)' : '';
  pos = { x, y }; explorador.style.left = x + '%'; explorador.style.top = y + '%';
  sfx.paso();
  return new Promise(res => setTimeout(res, 650));
}
function elegirAnimal() {
  const enCampo = new Set(arbustos.map(b => b.animal.id));
  const libres = ANIMALES.filter(a => !enCampo.has(a.id));
  const min = Math.min(...libres.map(a => E.coleccion[a.id] || 0));
  const menos = libres.filter(a => (E.coleccion[a.id] || 0) === min);   // primero los que aún no tiene
  return menos[azar(menos.length)];
}
function nuevoArbusto() {
  let x, y, intentos = 0;
  do { x = 12 + Math.random() * 76; y = 32 + Math.random() * 40; intentos++; }
  while (intentos < 30 && arbustos.some(b => Math.hypot(b.x - x, (b.y - y) * 1.4) < 20));
  const el = document.createElement('button'), animal = elegirAnimal();
  el.className = 'arbusto'; el.textContent = ['🌳', '🌲', '🌴', '🌳', '🌿'][azar(5)];
  el.style.left = x + '%'; el.style.top = y + '%';
  const b = { x, y, el, animal };
  el.onclick = async e => {
    e.stopPropagation();
    if (ocupado) return;
    ocupado = true;
    await caminar(x, Math.min(y + 9, 90));
    el.classList.add('sacude');
    const asoma = document.createElement('span');
    asoma.className = 'asoma'; asoma.textContent = animal.emo; asoma.style.left = x + '%'; asoma.style.top = y + '%';
    campo.appendChild(asoma); sfx.pop();
    setTimeout(() => { asoma.remove(); abrirReto(b); }, 800);
  };
  campo.appendChild(el); arbustos.push(b);
}
campo.onclick = e => {
  if (ocupado) return;
  const r = campo.getBoundingClientRect();
  caminar(Math.max(5, Math.min(95, (e.clientX - r.left) / r.width * 100)), Math.max(28, Math.min(92, (e.clientY - r.top) / r.height * 100)));
};
function entrarMundo() {
  mostrar('mundo'); pintarExplorador(); ocupado = false;

  $('bArca').querySelector('.lbl').textContent = T('Construir', 'Build') + ` 🪵${E.madera}`;

}

// ---------- Retos ----------
let reto = null, turnoLengua = 0;
const lenguaReto = () => E.idioma === 'ambos' ? (turnoLengua++ % 2 ? 'en' : 'es') : E.idioma;
const numOpciones = () => E.nivel + 1;                 // 2, 3 o 4
const maxContar = () => [3, 5, 8][E.nivel - 1];
function abrirReto(arbusto) {
  const a = arbusto.animal, l = lenguaReto(), tipo = Math.random() < 0.5 ? 'letra' : 'contar';
  reto = { arbusto, a, l, tipo, intentos: 0 };
  const ver = $('retoVer'), opc = $('retoOpciones');
  opc.innerHTML = '';
  if (tipo === 'letra') {
    const palabra = a[l][0], letra = sinAcento(palabra)[0].toUpperCase();
    reto.respuesta = letra;
    const resaltar = E.nivel < 3;
    ver.innerHTML = `<div class="animal-grande">${a.emo}</div><div class="palabra">${resaltar ? `<b>${palabra[0]}</b>${palabra.slice(1)}` : palabra}</div>`;
    const otras = mezclar([...LETRAS].filter(c => c !== letra)).slice(0, numOpciones() - 1);
    mezclar([letra, ...otras]).forEach(c => opc.appendChild(botonOpcion(c, c === letra)));
    const un = a.g === 'f' ? 'una' : 'un';
    reto.pregunta = l === 'es' ? `¡Mira, ${un} ${palabra.toLowerCase()}! ${palabra} empieza con la letra ${letra}. Toca la ${letra}.`
                               : `Look, a ${palabra.toLowerCase()}! ${palabra} starts with the letter ${letra}. Tap the ${letra}.`;
    $('retoPregunta').textContent = l === 'es' ? `Toca la letra ${letra}` : `Tap the letter ${letra}`;
  } else {
    const n = 1 + azar(maxContar());
    reto.respuesta = n;
    ver.innerHTML = '<div class="contables"></div>';
    let contados = 0;
    for (let k = 0; k < n; k++) {
      const c = document.createElement('button');
      c.className = 'contable'; c.textContent = a.emo;
      c.onclick = () => {   // tocar cada animal lo cuenta en voz alta
        if (c.querySelector('.num')) return;
        contados++; c.insertAdjacentHTML('beforeend', `<span class="num">${contados}</span>`);
        sfx.pop(); decir([{ l, t: String(contados) }]);
      };
      ver.firstChild.appendChild(c);
    }
    const cerca = [];
    for (let d = 1; cerca.length < 6; d++) { if (n - d >= 1) cerca.push(n - d); if (n + d <= Math.max(maxContar(), 3)) cerca.push(n + d); if (d > 8) break; }
    const otras = mezclar(cerca).slice(0, numOpciones() - 1);
    mezclar([n, ...otras]).forEach(v => opc.appendChild(botonOpcion(v, v === n, v <= 5 ? '●'.repeat(v) : '')));
    const plural = n === 1 ? a[l][0].toLowerCase() : a[l][1];
    const cuantos = a.g === 'f' ? 'Cuántas' : 'Cuántos';
    reto.pregunta = l === 'es' ? `¿${cuantos} ${a[l][1]} hay? Tócal${a.g === 'f' ? 'a' : 'o'}s para contarl${a.g === 'f' ? 'a' : 'o'}s.` : `How many ${a[l][1]}? Tap them to count.`;
    reto.plural = plural;
    $('retoPregunta').textContent = l === 'es' ? `¿${cuantos} hay?` : `How many?`;
  }
  $('reto').classList.add('abierta');
  decir([{ l, t: reto.pregunta }]);
}
function botonOpcion(valor, correcta, puntos = '') {
  const b = document.createElement('button');
  b.className = 'opcion'; b.innerHTML = `<span>${valor}</span>${puntos ? `<span class="puntos">${puntos}</span>` : ''}`;
  b.dataset.ok = correcta ? '1' : '';
  b.onclick = () => responder(b, correcta);
  return b;
}
$('retoOir').onclick = () => reto && decir([{ l: reto.l, t: reto.pregunta }]);
function responder(b, correcta) {
  if (!reto || b.disabled) return;
  const { l, a } = reto;
  if (!correcta) {
    reto.intentos++; b.disabled = true; b.classList.add('mal'); sfx.casi();
    decir([{ l, t: l === 'es' ? '¡Casi! Intenta otra vez.' : 'Almost! Try again.' }]);
    if (reto.intentos >= 2) $('retoOpciones').querySelector('[data-ok="1"]').classList.add('pista');
    return;
  }
  b.classList.add('bien'); sfx.bien();
  $('retoOpciones').querySelectorAll('button').forEach(x => x.disabled = true);
  if (reto.tipo === 'letra') {
    decir([{ l, t: l === 'es' ? `¡Muy bien! ${a.es[0]} empieza con ${reto.respuesta}.` : `Great job! ${a.en[0]} starts with ${reto.respuesta}.` }]);
  } else {
    const n = reto.respuesta, seq = Array.from({ length: n }, (_, k) => k + 1).join(', ');
    decir([{ l, t: l === 'es' ? `${seq}. ¡${n} ${reto.plural}! ¡Muy bien!` : `${seq}. ${n} ${reto.plural}! Great job!` }]);
  }
  const primera = reto.intentos === 0, arbusto = reto.arbusto;
  reto = null;
  setTimeout(() => { $('reto').classList.remove('abierta'); rescatar(arbusto, primera); }, 2200);
}

// ---------- Rescate y premios ----------
const desbloqueados = () => [...CARAS, ...GORROS].filter(([, p]) => p && p <= E.estrellas).map(([e]) => e);
function rescatar(arbusto, primera) {
  const a = arbusto.animal, antes = desbloqueados();
  E.coleccion[a.id] = (E.coleccion[a.id] || 0) + 1;
  const ganadas = primera ? 2 : 1;
  E.estrellas += ganadas; E.madera += MADERA_RESCATE; guardar(); barra();
  arbusto.el.remove(); arbustos = arbustos.filter(b => b !== arbusto);
  const los = a.g === 'f' ? 'las' : 'los';
  $('festejoPareja').textContent = a.emo + a.emo;
  $('festejoTexto').textContent = T(`¡Rescataste a ${los} ${a.es[1]}!`, `You rescued the ${a.en[1]}!`);
  $('festejoEstrellas').textContent = `+${ganadas} ⭐   +${MADERA_RESCATE} 🪵`;
  $('festejo').classList.add('abierta');
  sfx.fanfarria();
  setTimeout(() => di(`¡Rescataste a ${los} ${a.es[1]}!`, `You rescued the ${a.en[1]}!`), 300);
  desbloqueados().filter(e => !antes.includes(e)).forEach((e, k) => setTimeout(() => toast(T(`🎁 ¡Nuevo premio: ${e}!`, `🎁 New prize: ${e}!`)), 1200 + k * 2800));
}

// ---------- Construir el arca a escala (Génesis 6:14-22) ----------
// Vista de lado. 1 bloque = 5 codos: 60 bloques = 300 codos de largo, 6 bloques = 30 codos de alto.
const COLS = 60, FILAS = 6, MARGEN = 10, MUNDO_W = COLS + MARGEN * 2, MADERA_RESCATE = 25;
const PLANO = [];   // cada pieza: columna, fila, tipo y la misión a la que pertenece
(() => {
  const add = (c, r, tipo, m) => PLANO.push({ c, r, tipo, m, hecho: false, brea: false });
  for (let c = 1; c < COLS - 1; c++) add(c, 0, 'piso', 0);                       // 1. piso de abajo
  add(0, 0, 'puerta', 1); add(0, 1, 'puerta', 1);                                 // 2. puerta y paredes
  for (let r = 2; r < FILAS; r++) add(0, r, 'casco', 1);
  for (let r = 0; r < FILAS; r++) add(COLS - 1, r, 'casco', 1);
  for (const [fila, hueco] of [[2, 6], [4, COLS - 7]])                            // 3. tres pisos y escaleras
    for (let c = 1; c < COLS - 1; c++) if (c !== hueco) add(c, fila, 'piso', 2);
  for (let r = 0; r <= 2; r++) add(6, r, 'escalera', 2);
  for (let r = 2; r <= 4; r++) add(COLS - 7, r, 'escalera', 2);
  for (let c = 0; c < COLS; c++) add(c, FILAS - 1, c >= 25 && c < 35 ? 'ventana' : 'techo', 3);   // 4. techo y ventana
})();
const llevaBrea = p => p.tipo === 'casco' || p.tipo === 'techo' || (p.tipo === 'piso' && p.r === 0);  // 5. brea
const MISIONES = [
  { ref: 'Génesis 6:14-15', tit: ['El piso de abajo', 'The bottom floor'],
    es: 'Dios le dijo a Noé: «Haz un arca de madera.» Empieza por el piso de abajo. ¡El arca mide 300 codos de largo! Es más larga que una cancha de fútbol.',
    en: 'God told Noah: “Make an ark of wood.” Start with the bottom floor. The ark is 300 cubits long! That is longer than a soccer field.' },
  { ref: 'Génesis 6:16', tit: ['Las paredes y la puerta', 'The walls and the door'],
    es: 'Ahora las paredes. Dios le dijo a Noé: «Pon la puerta al costado del arca.»',
    en: 'Now the walls. God told Noah: “Put the door in the side of the ark.”' },
  { ref: 'Génesis 6:16', tit: ['Tres pisos', 'Three decks'],
    es: 'Dios le dijo a Noé: «Hazle tres pisos: abajo, en medio y arriba.» Pon los pisos y las escaleras.',
    en: 'God told Noah: “Make it with a lower, second and third deck.” Build the floors and the ladders.' },
  { ref: 'Génesis 6:15-16', tit: ['El techo y la ventana', 'The roof and the window'],
    es: 'Dios le dijo a Noé: «Hazle una ventana arriba.» Pon el techo. ¡El arca mide 30 codos de alto!',
    en: 'God told Noah: “Make a window at the top.” Build the roof. The ark is 30 cubits high!' },
  { ref: 'Génesis 6:14', tit: ['Brea por dentro y por fuera', 'Pitch inside and out'], brea: true,
    es: 'Dios le dijo a Noé: «Cúbrela con brea por dentro y por fuera», para que no entre el agua. ¡Pinta el arca con brea!',
    en: 'God told Noah: “Cover it with pitch inside and out,” so the water stays out. Paint the ark with pitch!' },
];
const FIN_OBRA = { ref: 'Génesis 6:22',
  es: '¡Lo lograste! Noé hizo todo lo que Dios le mandó.', en: 'You did it! Noah did everything God commanded him.' };
const piezasMision = i => MISIONES[i].brea ? PLANO.filter(llevaBrea) : PLANO.filter(p => p.m === i);
const lista = (p, i) => MISIONES[i].brea ? p.brea : p.hecho;
function avanceMision(i) { const ps = piezasMision(i); return [ps.filter(p => lista(p, i)).length, ps.length]; }
function avanceTotal() {
  let h = 0, t = 0;
  MISIONES.forEach((_, i) => { const [a, b] = avanceMision(i); h += a; t += b; });
  return h / t;
}
function guardarObra() { E.obra = PLANO.map(p => (p.hecho ? 1 : 0) + (p.brea ? 2 : 0)).join(''); guardar(); }
if (E.obra && E.obra.length === PLANO.length) [...E.obra].forEach((ch, i) => { PLANO[i].hecho = !!(+ch & 1); PLANO[i].brea = !!(+ch & 2); });

// Caja de cada pieza en bloques del mundo (y hacia arriba; 0 = el suelo)
function caja(p) {
  const x = MARGEN + p.c, y = p.r;
  if (p.tipo === 'piso') return { x, y, w: 1, h: 0.2 };
  if (p.tipo === 'techo' || p.tipo === 'ventana') return { x, y: y + 0.8, w: 1, h: 0.2 };
  return { x, y, w: 1, h: 1 };
}
const solida = p => p.hecho && p.tipo !== 'puerta' && p.tipo !== 'escalera';

// ---------- El monito ----------
const mono = { x: MARGEN - 3, y: 0, vx: 0, vy: 0, w: 0.6, h: 1.3, suelo: true, mira: 1, paso: 0, trepando: false };
const teclas = { izq: false, der: false, arriba: false, abajo: false, saltar: false };
function solidosEn(x, y, w, h) {
  const res = [];
  for (const p of PLANO) {
    if (!solida(p)) continue;
    const b = caja(p);
    if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) res.push(b);
  }
  return res;
}
function escaleraAqui() {   // devuelve el tope de la escalera si el monito está sobre una
  let tope = null;
  for (const p of PLANO) {
    if (!p.hecho || p.tipo !== 'escalera') continue;
    if (Math.abs(MARGEN + p.c + 0.5 - mono.x) < 0.45 && mono.y < p.r + 1 && mono.y + mono.h > p.r) tope = Math.max(tope ?? 0, p.r + 1);
  }
  return tope;
}
function moverMono(dt) {
  mono.vx = ((teclas.der ? 1 : 0) - (teclas.izq ? 1 : 0)) * 4.5;
  if (mono.vx) mono.mira = Math.sign(mono.vx);
  const tope = escaleraAqui();
  if (tope !== null && (teclas.arriba || teclas.abajo)) mono.trepando = true;
  if (tope === null) mono.trepando = false;
  if (mono.trepando) mono.vy = teclas.arriba ? 3 : teclas.abajo ? -3 : 0;
  else {
    mono.vy -= 25 * dt;
    if (teclas.saltar && mono.suelo) { mono.vy = 9; tono(520, 0, 0.12, 'sine', 0.08); }
  }
  teclas.saltar = false;
  // Horizontal (sube solo los escalones bajitos, como el borde del piso)
  let nx = Math.max(mono.w / 2, Math.min(MUNDO_W - mono.w / 2, mono.x + mono.vx * dt));
  for (const b of solidosEn(nx - mono.w / 2, mono.y, mono.w, mono.h)) {
    const escalon = b.y + b.h - mono.y;
    if (escalon > 0 && escalon <= 0.3 && !solidosEn(nx - mono.w / 2, b.y + b.h, mono.w, mono.h).length) mono.y = b.y + b.h;
    else nx = mono.vx > 0 ? b.x - mono.w / 2 - 0.001 : b.x + b.w + mono.w / 2 + 0.001;
  }
  mono.x = nx;
  // Vertical
  let ny = mono.y + mono.vy * dt;
  if (mono.trepando && tope !== null) ny = Math.min(ny, tope - 0.15);
  mono.suelo = false;
  if (ny <= 0) { ny = 0; mono.vy = 0; mono.suelo = true; }
  for (const b of solidosEn(mono.x - mono.w / 2, ny, mono.w, mono.h)) {
    if (mono.vy <= 0) { ny = b.y + b.h; mono.suelo = true; } else ny = b.y - mono.h - 0.001;
    mono.vy = 0;
  }
  mono.y = ny;
  if (mono.trepando) mono.suelo = true;
  if (mono.vx && mono.suelo) mono.paso += dt * 12;
}

// ---------- Dibujo ----------
const lienzo = $('lienzoObra'), cx = lienzo.getContext('2d');
let enObra = false, vista = false, TS = 60, camX = 0, W2 = 0, H2 = 0, baseY = 0, tAnterior = 0, astillas = [];
function medirObra() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W2 = innerWidth; H2 = innerHeight;
  lienzo.width = W2 * dpr; lienzo.height = H2 * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseY = H2 - Math.max(120, Math.min(W2, H2) * 0.15 + 40);
  const arriba = $('mision').getBoundingClientRect().bottom + 12;
  TS = vista ? (W2 - 24) / (COLS + 2) : Math.max(34, Math.min((baseY - arriba) / 6.6, W2 / 6.5));
}
addEventListener('resize', () => { if (enObra) medirObra(); });
const sx = x => (x - camX) * TS, sy = y => baseY - y * TS;
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif';
function emoji(t, x, y, tam) { cx.font = `${tam}px ${EMOJI}`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(t, x, y); }

function dibujarPieza(p, estado, pulso) {
  const b = caja(p), x = sx(b.x), y = sy(b.y + b.h), w = b.w * TS, h = b.h * TS;
  if (x > W2 + TS || x + w < -TS) return;
  if (estado !== 'hecho') {
    cx.setLineDash([5, 4]); cx.lineWidth = 2;
    cx.strokeStyle = estado === 'meta' ? '#ffffff' : '#ffffff55';
    if (estado === 'meta') { cx.fillStyle = `rgba(255,255,255,${0.15 + 0.2 * pulso})`; cx.fillRect(x + 1, y + 1, w - 2, h - 2); }
    cx.strokeRect(x + 1, y + 1, w - 2, Math.max(2, h - 2)); cx.setLineDash([]);
    return;
  }
  const brea = p.brea;
  if (p.tipo === 'escalera') {
    cx.strokeStyle = '#7c4a21'; cx.lineWidth = Math.max(2, TS * 0.06);
    cx.beginPath(); cx.moveTo(x + w * 0.25, y); cx.lineTo(x + w * 0.25, y + h); cx.moveTo(x + w * 0.75, y); cx.lineTo(x + w * 0.75, y + h);
    for (let k = 1; k <= 3; k++) { cx.moveTo(x + w * 0.25, y + h * k / 4); cx.lineTo(x + w * 0.75, y + h * k / 4); }
    cx.stroke(); return;
  }
  if (p.tipo === 'ventana') { cx.fillStyle = '#bfe6ffcc'; cx.fillRect(x, y, w, h); cx.strokeStyle = '#7c4a21'; cx.lineWidth = 1; cx.strokeRect(x, y, w, h); return; }
  if (p.tipo === 'puerta') {
    cx.fillStyle = '#7c4a21'; cx.fillRect(x + w * 0.1, y, w * 0.8, h);
    if (p.r === 0) { cx.fillStyle = '#fcd34d'; cx.beginPath(); cx.arc(x + w * 0.7, y + h * 0.3, Math.max(2, TS * 0.06), 0, 7); cx.fill(); }
    return;
  }
  cx.fillStyle = brea ? '#3a2a1f' : (p.c % 2 ? '#a0632e' : '#8b5426'); cx.fillRect(x, y, w, h);
  cx.strokeStyle = brea ? '#1c130d' : '#5c2e0e'; cx.lineWidth = 1; cx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  if (h > TS * 0.5) { cx.beginPath(); cx.moveTo(x, y + h / 3); cx.lineTo(x + w, y + h / 3); cx.moveTo(x, y + 2 * h / 3); cx.lineTo(x + w, y + 2 * h / 3); cx.stroke(); }
}
function dibujarMono() {
  const px = sx(mono.x), py = sy(mono.y), h = mono.h * TS, av = E.avatar;
  cx.save(); cx.translate(px, py);
  if (mono.mira < 0) cx.scale(-1, 1);
  const balanceo = Math.sin(mono.paso) * 0.35 * (mono.vx && mono.suelo ? 1 : 0);
  cx.strokeStyle = '#1f2937'; cx.lineWidth = Math.max(3, TS * 0.08); cx.lineCap = 'round';
  cx.beginPath();
  cx.moveTo(0, -h * 0.3); cx.lineTo(Math.sin(balanceo) * h * 0.25, 0);
  cx.moveTo(0, -h * 0.3); cx.lineTo(-Math.sin(balanceo) * h * 0.25, 0);
  cx.stroke();
  cx.fillStyle = av.color; cx.beginPath(); cx.roundRect?.(-h * 0.17, -h * 0.62, h * 0.34, h * 0.36, 6); cx.fill();
  cx.beginPath(); cx.arc(0, -h * 0.76, h * 0.22, 0, 7); cx.fill();
  emoji(av.cara, 0, -h * 0.76, h * 0.34);
  if (av.gorro) emoji(av.gorro, 0, -h * 0.98, h * 0.28);
  cx.restore();
}
function dibujarObra(dt) {
  const objetivo = vista ? MARGEN - 1 : Math.max(0, Math.min(MUNDO_W - W2 / TS, mono.x - W2 / TS / 2));
  camX += (objetivo - camX) * Math.min(1, dt * 6);
  // Cielo, sol y suelo
  const cielo = cx.createLinearGradient(0, 0, 0, baseY);
  cielo.addColorStop(0, '#8fd3ff'); cielo.addColorStop(1, '#e0f6ff');
  cx.fillStyle = cielo; cx.fillRect(0, 0, W2, baseY);
  emoji('☀️', W2 - 60, 150, 56);
  cx.fillStyle = '#6cc070'; cx.fillRect(0, baseY, W2, H2 - baseY);
  cx.fillStyle = '#4e9a52'; cx.fillRect(0, baseY, W2, 6);
  // Regla en codos (cada 10 bloques = 50 codos)
  cx.fillStyle = '#1f2937'; cx.strokeStyle = '#1f2937'; cx.lineWidth = 2;
  cx.font = `700 ${Math.max(11, Math.min(15, TS * 0.25))}px system-ui, sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'top';
  cx.beginPath(); cx.moveTo(sx(MARGEN), baseY + 14); cx.lineTo(sx(MARGEN + COLS), baseY + 14); cx.stroke();
  for (let k = 0; k <= 6; k++) {
    const x = sx(MARGEN + k * 10);
    cx.beginPath(); cx.moveTo(x, baseY + 8); cx.lineTo(x, baseY + 20); cx.stroke();
    cx.fillText(k === 6 ? T('300 codos', '300 cubits') : String(k * 50), x, baseY + 24);
  }
  cx.textAlign = 'right'; cx.textBaseline = 'middle';
  for (let k = 0; k <= 3; k++) cx.fillText(k === 3 ? T('30 codos', '30 cubits') : String(k * 10), sx(MARGEN) - 8, sy(k * 2));
  // Pared de atrás, cuando ya hay paredes
  if (E.mision >= 2) {
    cx.fillStyle = '#c08a5a55';
    cx.fillRect(sx(MARGEN + 1), sy(FILAS), (COLS - 2) * TS, FILAS * TS);
  }
  // Piezas
  const pulso = (Math.sin(performance.now() / 250) + 1) / 2, m = MISIONES[E.mision];
  for (const p of PLANO) dibujarPieza(p, p.hecho ? 'hecho' : p.m === E.mision ? 'meta' : 'futuro', pulso);
  if (m?.brea) {   // marca lo que falta pintar con brea
    cx.setLineDash([4, 3]); cx.lineWidth = 2; cx.strokeStyle = `rgba(250,204,21,${0.5 + 0.5 * pulso})`;
    for (const p of PLANO) if (llevaBrea(p) && !p.brea) { const b = caja(p); cx.strokeRect(sx(b.x) + 1, sy(b.y + b.h) + 1, b.w * TS - 2, Math.max(2, b.h * TS - 2)); }
    cx.setLineDash([]);
  }
  // Astillas al construir
  astillas = astillas.filter(a => (a.vida -= dt) > 0);
  for (const a of astillas) { a.x += a.vx * dt; a.y += a.vy * dt; a.vy -= 12 * dt; cx.fillStyle = a.col; cx.fillRect(sx(a.x) - 3, sy(a.y) - 3, 6, 6); }
  dibujarMono();
}
function bucleObra(t) {
  if (!enObra) return;
  const dt = Math.min(0.05, (t - tAnterior) / 1000 || 0); tAnterior = t;
  moverMono(dt); dibujarObra(dt);
  requestAnimationFrame(bucleObra);
}

// ---------- Construir tocando el plano ----------
let tSonido = 0, tAvisoMadera = 0, misionDicha = -1;
function piezaCerca(wx, wy) {   // la pieza pendiente de la misión más cercana al dedo (máx. 1 bloque)
  const m = MISIONES[E.mision]; if (!m) return null;
  let mejor = null, dmin = 1;
  for (const p of PLANO) {
    if (m.brea ? !(llevaBrea(p) && !p.brea) : (p.m !== E.mision || p.hecho)) continue;
    const b = caja(p), d = Math.hypot(b.x + b.w / 2 - wx, b.y + b.h / 2 - wy);
    if (d < dmin) { dmin = d; mejor = p; }
  }
  return mejor;
}
function construirEn(px, py) {
  const wx = px / TS + camX, wy = (baseY - py) / TS, p = piezaCerca(wx, wy), m = MISIONES[E.mision];
  if (!p) return;
  if (m.brea) p.brea = true;
  else {
    if (E.madera <= 0) { sinMadera(); return; }
    p.hecho = true; E.madera--;
    if (solida(p) && solidosEn(mono.x - mono.w / 2, mono.y, mono.w, mono.h).length) mono.y = caja(p).y + caja(p).h;   // no dejar al monito atorado
  }
  const b = caja(p);
  for (let k = 0; k < 5; k++) astillas.push({ x: b.x + 0.5, y: b.y + b.h, vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 3, vida: 0.6, col: m.brea ? '#1c130d' : '#c08a5a' });
  const ahora = performance.now();
  if (ahora - tSonido > 90) { m.brea ? tono(200, 0, 0.08, 'sine', 0.1) : sfx.martillo(); tSonido = ahora; }
  pintarMision();
  const [h, t] = avanceMision(E.mision);
  if (h === t) completarMision(); else if (h % 10 === 0) guardarObra();
}
function sinMadera() {
  const ahora = performance.now();
  if (ahora - tAvisoMadera < 4000) return;
  tAvisoMadera = ahora;
  toast(T('🪵 ¡Se acabó la madera! Rescata animales para conseguir más.', '🪵 Out of wood! Rescue animals to get more.'));
  di('¡Se acabó la madera! Rescata animales para conseguir más.', 'Out of wood! Rescue animals to get more.');
  $('bIrRescatar').classList.add('pulsa');
}
function completarMision() {
  const hecha = MISIONES[E.mision];
  E.mision++; E.estrellas += 5; guardarObra(); barra(); sfx.fanfarria();
  toast(T(`✅ ¡${hecha.tit[0]}: listo! +5 ⭐`, `✅ ${hecha.tit[1]}: done! +5 ⭐`));
  pintarMision();
  if (E.mision >= MISIONES.length) { setTimeout(finalArca, 1500); return; }
  setTimeout(decirMision, 1600);
}
function decirMision() { const m = MISIONES[E.mision]; if (m) { misionDicha = E.mision; di(m.es, m.en); } }
function pintarMision() {
  const m = MISIONES[E.mision], tarjeta = $('mision');
  barra();
  if (!m) {
    tarjeta.querySelector('.ref').textContent = FIN_OBRA.ref;
    tarjeta.querySelector('.tit').textContent = T('🌈 ¡Arca terminada!', '🌈 Ark finished!');
    tarjeta.querySelector('.barraAv span').style.width = '100%';
    tarjeta.querySelector('.cuenta').textContent = T('Noé hizo todo lo que Dios le mandó.', 'Noah did everything God commanded him.');
    return;
  }
  const [h, t] = avanceMision(E.mision);
  tarjeta.querySelector('.ref').textContent = `📜 ${m.ref} · ${T('Misión', 'Mission')} ${E.mision + 1}/${MISIONES.length}`;
  tarjeta.querySelector('.tit').textContent = T(m.tit[0], m.tit[1]);
  tarjeta.querySelector('.barraAv span').style.width = (h / t * 100) + '%';
  tarjeta.querySelector('.cuenta').textContent = `${h} / ${t}` + (m.brea ? '  ⚫ ' + T('toca para pintar con brea', 'tap to paint with pitch') : `  ·  🪵 ${E.madera}  ·  ` + T('toca las líneas blancas', 'tap the white lines'));
}
let dedoAbajo = false;
lienzo.addEventListener('pointerdown', e => { audio(); dedoAbajo = true; lienzo.setPointerCapture?.(e.pointerId); construirEn(e.clientX, e.clientY); });
lienzo.addEventListener('pointermove', e => { if (dedoAbajo) construirEn(e.clientX, e.clientY); });
const soltarDedo = () => { if (dedoAbajo) { dedoAbajo = false; guardarObra(); } };
['pointerup', 'pointercancel'].forEach(t => lienzo.addEventListener(t, soltarDedo));

// Botones y teclado para mover al monito
document.querySelectorAll('#mandos [data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audio(); teclas[k] = true; if (k === 'arriba') teclas.saltar = true; b.classList.add('on'); };
  const off = () => { teclas[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, off));
});
const MAPA_TECLAS = { ArrowLeft: 'izq', KeyA: 'izq', ArrowRight: 'der', KeyD: 'der', ArrowUp: 'arriba', KeyW: 'arriba', Space: 'arriba', ArrowDown: 'abajo', KeyS: 'abajo' };
addEventListener('keydown', e => {
  const k = MAPA_TECLAS[e.code]; if (!k || !enObra) return;
  e.preventDefault(); if (k === 'arriba' && !e.repeat) teclas.saltar = true; teclas[k] = true;
});
addEventListener('keyup', e => { const k = MAPA_TECLAS[e.code]; if (k) teclas[k] = false; });
$('bVista').onclick = () => { vista = !vista; $('bVista').classList.toggle('on', vista); medirObra(); };
$('bIrRescatar').onclick = () => { $('bIrRescatar').classList.remove('pulsa'); entrarMundo(); };
$('misionOir').onclick = () => { const m = MISIONES[E.mision]; m ? di(m.es, m.en) : di(FIN_OBRA.es, FIN_OBRA.en); };

function entrarObra() {
  mostrar('obra'); pintarMision(); medirObra();
  camX = vista ? MARGEN - 1 : Math.max(0, mono.x - W2 / TS / 2);
  requestAnimationFrame(t => { tAnterior = t; bucleObra(t); });
  if (misionDicha !== E.mision) decirMision();
}

// ---------- Ajustes para adultos (mantener 🔒 3 segundos) ----------
const bCand = $('candado');
let tCand = null;
bCand.addEventListener('pointerdown', () => {
  bCand.classList.add('cargando');
  tCand = setTimeout(() => { tCand = null; bCand.classList.remove('cargando'); abrirPanel(); }, 3000);
});
const soltarCandado = () => { if (tCand) { clearTimeout(tCand); tCand = null; bCand.classList.remove('cargando'); } };
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => bCand.addEventListener(t, soltarCandado));
addEventListener('contextmenu', e => e.preventDefault());

function radios(cont, nombre, opciones, actual, alCambiar) {
  cont.innerHTML = '';
  for (const [v, txt] of opciones) {
    const d = document.createElement('div');
    d.className = 'opc';
    d.innerHTML = `<input type="radio" name="${nombre}" id="${nombre}-${v}" ${String(actual) === String(v) ? 'checked' : ''}><label for="${nombre}-${v}">${txt}</label>`;
    d.querySelector('input').onchange = () => alCambiar(v);
    cont.appendChild(d);
  }
}
function abrirPanel() {
  $('nombre').value = E.nombre;
  radios($('pIdioma'), 'idioma', [['es', 'Español'], ['en', 'English'], ['ambos', 'Bilingüe (español + English)']], E.idioma, v => { E.idioma = v; guardar(); });
  radios($('pNivel'), 'nivel', [[1, 'Fácil'], [2, 'Medio'], [3, 'Difícil']], E.nivel, v => { E.nivel = Number(v); guardar(); });
  $('panel').classList.add('abierta');
}
$('nombre').oninput = () => { E.nombre = $('nombre').value; guardar(); };
$('bCerrarPanel').onclick = () => {
  $('panel').classList.remove('abierta');
  pintarInicio(); mostrar('inicio');
};
$('bReiniciar').onclick = () => {
  if (!confirm('¿Borrar estrellas, animales, el arca construida y los premios? Esto no se puede deshacer.')) return;
  const { nombre, idioma } = E;
  E = { ...JSON.parse(JSON.stringify(DEF)), nombre, idioma };
  PLANO.forEach(p => { p.hecho = false; p.brea = false; });
  Object.assign(mono, { x: MARGEN - 3, y: 0, vx: 0, vy: 0 });
  arbustos.forEach(b => b.el.remove()); arbustos = [];
  guardar(); $('panel').classList.remove('abierta'); pintarInicio(); mostrar('inicio');
};
function cerrarCapas() { ['reto', 'festejo'].forEach(id => $(id).classList.remove('abierta')); reto = null; ocupado = false; }

pintarInicio();
</script>
