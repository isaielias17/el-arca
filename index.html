<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<title>El Arca</title>
<style>
  :root { --cielo1: #8fd3ff; --cielo2: #e0f6ff; --pasto: #7bd389; --fg: #1f2937; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; color: var(--fg); background: var(--cielo2); }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; }

  #barra { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; gap: 8px; align-items: center; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none; }
  #barra > * { pointer-events: auto; }
  .chip { background: #ffffffd9; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 16px; box-shadow: 0 2px 0 #0001; }
  .chip { white-space: nowrap; }
  @media (max-width: 440px) { #barra { gap: 5px; padding-left: 8px; padding-right: 8px; } .chip { font-size: 14px; padding: 5px 9px; } }
  .espacio { flex: 1; }
  #candado.cargando { animation: llenar 3s linear forwards; }
  @keyframes llenar { from { box-shadow: inset 0 0 0 0 #0003; } to { box-shadow: inset 0 0 0 24px #0003; } }

  .pantalla { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; padding: 64px 16px 16px; overflow-y: auto; }
  .pantalla.activa { display: flex; }
  h1 { font-size: clamp(26px, 6vmin, 44px); text-shadow: 0 2px 0 #fff; text-align: center; }
  h2 { font-size: clamp(22px, 5vmin, 34px); text-align: center; margin-bottom: 8px; }

  /* Inicio: el arca */
  #arca.sacude { animation: sacude .4s; }
  .tabla.nueva { animation: caer .45s ease-out; transform-box: fill-box; }
  @keyframes caer { from { transform: translateY(-40px); opacity: 0; } }
  .fila-botones { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .grande { background: #22c55e; color: #fff; font-size: clamp(22px, 5vmin, 34px); font-weight: 800; padding: 16px 36px; border-radius: 24px; box-shadow: 0 6px 0 #15803d; }
  .medio { background: #fff; font-size: clamp(16px, 3.6vmin, 22px); font-weight: 700; padding: 10px 16px; border-radius: 20px; box-shadow: 0 5px 0 #0002; display: flex; align-items: center; gap: 8px; }
  .grande:active, .medio:active, .opcion:active { transform: translateY(3px); }
  .pulsa { animation: pulsa 1s infinite; }
  @keyframes pulsa { 50% { transform: scale(1.08); } }

  /* Mundo para explorar */
  #mundo { padding: 0; background: linear-gradient(var(--cielo1) 0 22%, var(--pasto) 22% 100%); overflow: hidden; }
  #campo { position: absolute; inset: 0; }
  .arbusto { position: absolute; transform: translate(-50%, -50%); font-size: clamp(56px, 13vmin, 110px); background: none; line-height: 1; filter: drop-shadow(0 6px 0 #0002); }
  .arbusto.sacude { animation: sacudeA .4s; }
  @keyframes sacudeA { 25% { transform: translate(-50%, -50%) rotate(-8deg); } 75% { transform: translate(-50%, -50%) rotate(8deg); } }
  @keyframes sacude { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  .asoma { position: absolute; transform: translate(-50%, -115%); font-size: clamp(40px, 9vmin, 72px); animation: asoma .4s ease-out; pointer-events: none; }
  @keyframes asoma { from { transform: translate(-50%, -30%) scale(.3); opacity: 0; } }
  #explorador { position: absolute; transform: translate(-50%, -60%); transition: left .6s ease-in-out, top .6s ease-in-out; pointer-events: none; z-index: 5; }
  #bArca { position: absolute; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; }

  /* Personaje */
  .avatar { position: relative; display: inline-grid; place-items: center; border-radius: 50%; background: var(--col); box-shadow: 0 4px 0 #0002; flex: none; }
  .avatar .cara { line-height: 1; }
  .avatar .gorro { position: absolute; left: 50%; top: 0; transform: translate(-50%, -45%); line-height: 1; }
  #personaje, #album { background: linear-gradient(var(--cielo1), var(--cielo2)); gap: 10px; }
  .grupo { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 640px; }
  .item { width: 72px; height: 72px; border-radius: 18px; background: #fff; font-size: 40px; display: grid; place-items: center; box-shadow: 0 4px 0 #0002; position: relative; }
  .item.sel { outline: 4px solid #22c55e; }
  .item.bloq { opacity: .45; }
  .item .precio { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 12px; font-weight: 800; }
  h3 { font-size: 18px; margin-top: 8px; }

  /* Álbum */
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; width: min(100%, 720px); }
  .ficha { background: #fff; border-radius: 18px; padding: 8px; text-align: center; box-shadow: 0 4px 0 #0002; }
  .ficha .emo { font-size: 48px; line-height: 1.1; }
  .ficha.no .emo { filter: brightness(0); opacity: .2; }
  .ficha small { display: block; font-weight: 700; font-size: 13px; }

  /* Capas: retos, festejo, final, ajustes */
  .capa { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: #0007; padding: 16px; }
  .capa.abierta { display: grid; }
  .tarjeta { background: #fff; border-radius: 28px; padding: 20px; width: min(94vw, 660px); max-height: 94vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; box-shadow: 0 10px 0 #0003; }
  .animal-grande { font-size: clamp(80px, 22vmin, 150px); line-height: 1; }
  .palabra { font-size: clamp(34px, 9vmin, 60px); font-weight: 800; letter-spacing: .04em; }
  .palabra b { color: #ef4444; text-decoration: underline; }
  #retoPregunta { font-size: clamp(18px, 4.5vmin, 26px); font-weight: 700; text-align: center; }
  #retoOpciones { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .opcion { min-width: clamp(80px, 20vmin, 120px); min-height: clamp(80px, 20vmin, 120px); border-radius: 24px; background: #e0f2fe; font-size: clamp(40px, 11vmin, 72px); font-weight: 800; box-shadow: 0 6px 0 #0284c733; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; }
  .opcion .puntos { font-size: clamp(12px, 3vmin, 18px); letter-spacing: 2px; color: #0284c7; }
  .opcion.mal { opacity: .35; animation: no .3s; }
  @keyframes no { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .opcion.pista { animation: pulsa .8s infinite; background: #fef08a; }
  .opcion.bien { background: #86efac; }
  .contables { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .contable { font-size: clamp(44px, 11vmin, 76px); background: none; position: relative; line-height: 1; }
  .contable .num { position: absolute; right: -4px; top: -4px; background: #ef4444; color: #fff; font-size: 16px; font-weight: 800; border-radius: 999px; min-width: 26px; height: 26px; display: grid; place-items: center; }
  .oir { position: absolute; right: 12px; top: 12px; background: #f1f5f9; }
  .pareja { font-size: clamp(70px, 18vmin, 120px); animation: salta .5s infinite alternate; }
  @keyframes salta { to { transform: translateY(-12px); } }
  .texto-grande { font-size: clamp(20px, 5vmin, 30px); font-weight: 800; text-align: center; }

  #final { background: linear-gradient(#4b5563, #9ca3af); overflow: hidden; transition: background 2s; }
  #final.sol { background: linear-gradient(#8fd3ff, #e0f6ff); }
  #final .contenido { display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1; width: min(94vw, 600px); }
  #arcoiris { width: min(80vw, 480px); aspect-ratio: 2; opacity: 0; transition: opacity 2.5s; margin-bottom: -18%;
    background: radial-gradient(50% 100% at 50% 100%, transparent 50%, #8b5cf6 50% 58%, #3b82f6 58% 66%, #22c55e 66% 74%, #facc15 74% 82%, #f97316 82% 90%, #ef4444 90% 98%, transparent 98%); }
  #final.sol #arcoiris { opacity: 1; }
  #final .arca-final { width: min(80vw, 480px); }
  #historia { background: #ffffffe6; border-radius: 18px; padding: 12px 16px; font-size: clamp(16px, 3.8vmin, 21px); font-weight: 600; line-height: 1.4; text-align: center; opacity: 0; transition: opacity 1s; }
  #final.sol #historia { opacity: 1; }
  .gota { position: absolute; top: -20px; width: 2px; height: 18px; background: #bfdbfe; animation: cae linear infinite; }
  #final.sol .gota { display: none; }
  @keyframes cae { to { transform: translateY(110vh); } }

  #panel .tarjeta { align-items: stretch; }
  #panel label { font-weight: 600; }
  #panel input[type=text] { font: inherit; padding: 10px 12px; border: 1px solid #0002; border-radius: 12px; width: 100%; }
  .opc { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .opc input { width: 22px; height: 22px; }
  .boton { background: #f1f5f9; border-radius: 999px; padding: 10px 16px; font-weight: 700; }
  .boton.principal { background: #1f2937; color: #fff; }
  .boton.peligro { background: #fee2e2; color: #b91c1c; }
  /* Construir el arca */
  #obra { padding: 0; background: #8fd3ff; overflow: hidden; }
  #lienzoObra { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #mision { position: absolute; top: max(56px, calc(env(safe-area-inset-top) + 50px)); left: 50%; transform: translateX(-50%); width: min(94vw, 560px); background: #fffffff0; border-radius: 18px; padding: 8px 52px 8px 14px; box-shadow: 0 4px 0 #0002; z-index: 4; }
  #mision .ref { font-size: 12px; font-weight: 800; color: #b45309; }
  #mision .tit { font-size: clamp(15px, 3.6vmin, 20px); font-weight: 800; }
  .barraAv { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .barraAv span { display: block; height: 100%; background: #22c55e; width: 0; transition: width .3s; }
  #mision .cuenta { font-size: 13px; font-weight: 700; color: #475569; margin-top: 2px; }
  #misionOir { position: absolute; right: 8px; top: 8px; }
  #mandos { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; z-index: 4; pointer-events: none; }
  .grupoMando { display: flex; gap: 10px; pointer-events: auto; }
  .grupoMando.columna { flex-direction: column; gap: 8px; }
  .grupoMando button { width: clamp(60px, 15vmin, 84px); height: clamp(60px, 15vmin, 84px); border-radius: 22px; background: #ffffffe0; font-size: clamp(26px, 7vmin, 38px); font-weight: 800; box-shadow: 0 5px 0 #0003; touch-action: none; }
  .grupoMando.columna button { width: 48px; height: 48px; font-size: 22px; border-radius: 16px; }
  .grupoMando button.on { transform: translateY(3px); background: #fef08a; }

  /* Lobby (como el de los juegos grandes): personaje en su isla, misiones del día y modos de juego */
  #inicio { background: linear-gradient(#6ec6ff, #d6f1ff 58%, #8ad0f0 58%, #3a9bd9); padding: 60px 14px 20px; }
  #lobby { width: min(100%, 1100px); display: grid; gap: 14px; grid-template-areas: "cab" "esc" "mod" "mis"; margin: auto 0; }
  @media (min-width: 860px) and (min-aspect-ratio: 1/1) { #lobby { grid-template-columns: 1fr 1.15fr 1fr; grid-template-areas: "cab cab cab" "mis esc mod"; align-items: start; } }
  #lobbyCab { grid-area: cab; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #bPase { display: flex; align-items: center; gap: 10px; background: #1e1b4b; color: #fff; border-radius: 999px; padding: 6px 16px 6px 6px; font-weight: 800; font-size: 16px; box-shadow: 0 5px 0 #0004; }
  .nv { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(#fde047, #f59e0b); color: #1e1b4b; display: grid; place-items: center; font-size: 21px; font-weight: 900; flex: none; }
  .xpbar { width: clamp(90px, 28vw, 200px); height: 12px; border-radius: 999px; background: #ffffff33; overflow: hidden; display: block; }
  .xpbar span { display: block; height: 100%; background: linear-gradient(90deg, #22d3ee, #a78bfa); width: 0; transition: width .6s; }
  #escenario { grid-area: esc; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #isla { position: relative; width: min(84vw, 340px); height: min(62vw, 250px); }
  #isla::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; border-radius: 50%; background: radial-gradient(#86efac 0 52%, #fde68a 53% 68%, #7dd3fc88 69%); }
  #avLobby { position: absolute; left: 50%; bottom: 17%; transform: translateX(-50%); background: none; }
  #avAnim { display: inline-block; transform-origin: 50% 100%; }
  #mascotaLobby { position: absolute; right: 6%; bottom: 14%; font-size: clamp(44px, 12vmin, 68px); background: none; line-height: 1; animation: flota 2.4s ease-in-out infinite; }
  #mascotaLobby.salta { animation: brinco .5s; }
  @keyframes flota { 50% { transform: translateY(-8px); } }
  @keyframes brinco { 40% { transform: translateY(-40px) rotate(-10deg); } }
  #estelaLobby span { position: absolute; bottom: 20%; font-size: 24px; opacity: 0; animation: chispa 2.5s ease-out infinite; pointer-events: none; }
  @keyframes chispa { 0% { opacity: 0; transform: translateY(0) scale(.5); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-140px) scale(1.2); } }
  #emoteIco { position: absolute; left: 50%; top: 0; transform: translateX(-50%); font-size: 48px; opacity: 0; pointer-events: none; }
  #emoteIco.ver { animation: emoteIco 1.4s ease-out; }
  @keyframes emoteIco { 0% { opacity: 0; transform: translate(-50%, 30px) scale(.4); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
  .e-saludo { animation: e-saludo 1.2s; } @keyframes e-saludo { 20%, 60% { transform: rotate(-12deg); } 40%, 80% { transform: rotate(12deg); } }
  .e-baile { animation: e-baile 1.4s; } @keyframes e-baile { 12%, 62% { transform: translateY(-22px) rotate(-14deg); } 37%, 87% { transform: translateY(-22px) rotate(14deg); } 25%, 50%, 75% { transform: none; } }
  .e-voltereta { animation: e-voltereta 1.1s ease-in-out; } @keyframes e-voltereta { 45% { transform: translateY(-90px) rotate(200deg); } 90% { transform: translateY(0) rotate(360deg); } 100% { transform: rotate(360deg); } }
  .e-robot { animation: e-robot 1.4s steps(1); } @keyframes e-robot { 15% { transform: translateX(-12px) rotate(-8deg); } 30% { transform: translateX(12px) rotate(8deg); } 45% { transform: translateY(-14px); } 60% { transform: translateX(-12px) rotate(8deg); } 75% { transform: translateX(12px) rotate(-8deg); } 90% { transform: none; } }
  .e-giro { animation: e-giro 1.3s ease-in-out; } @keyframes e-giro { 50% { transform: translateY(-30px) rotateY(540deg); } 100% { transform: rotateY(1080deg); } }
  #emotes button { width: 60px; height: 60px; border-radius: 50%; background: #fff; font-size: 30px; box-shadow: 0 4px 0 #0002; }
  #emotes button:active { transform: translateY(3px); }
  #misiones { grid-area: mis; background: #ffffffe8; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 0 #0002; }
  #misiones h3 { margin: 0; font-size: 18px; }
  .diaria { display: flex; align-items: center; gap: 10px; background: #f1f5f9; border-radius: 16px; padding: 8px 10px; text-align: left; width: 100%; }
  .diaria .ico { font-size: 30px; flex: none; }
  .diaria .txt { flex: 1; min-width: 0; }
  .diaria b { font-size: 15px; display: block; }
  .diaria .barraAv { margin-top: 4px; }
  .diaria .barraAv span { background: #8b5cf6; }
  .diaria .pr { font-weight: 900; color: #7c3aed; font-size: 14px; white-space: nowrap; }
  .diaria.hecha { background: #dcfce7; }
  .diaria.hecha .barraAv span { background: #22c55e; }
  #bCofre { font-size: 22px; padding: 12px 20px; background: linear-gradient(#fbbf24, #f59e0b); box-shadow: 0 6px 0 #b45309; }
  #cofreListo { text-align: center; font-weight: 700; color: #15803d; }
  #modos { grid-area: mod; display: flex; flex-direction: column; gap: 12px; }
  .modo { position: relative; border-radius: 24px; padding: 12px 16px; color: #fff; text-align: left; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 7px 0 #0003; overflow: hidden; min-height: 120px; width: 100%; }
  .modo:active { transform: translateY(4px); box-shadow: 0 3px 0 #0003; }
  .modo b { font-size: clamp(22px, 4.6vmin, 30px); font-weight: 900; text-shadow: 0 2px 0 #0003; position: relative; padding-right: 58px; line-height: 1.15; }
  .modo small { font-weight: 700; font-size: 14px; position: relative; }
  .modo.construir { background: linear-gradient(135deg, #f59e0b, #ea580c); }
  .modo.rescate { background: linear-gradient(135deg, #22c55e, #0d9488); }
  .modo .ico { position: absolute; right: 12px; top: 8px; font-size: 56px; }
  .modo .jugar { align-self: flex-start; background: #fff; color: #111; font-weight: 900; border-radius: 999px; padding: 5px 16px; margin-top: 4px; position: relative; }
  .modo #arca { width: min(100%, 210px); align-self: center; margin: -4px 0 -10px; }
  .modo #arca svg { width: 100%; height: auto; display: block; }
  #bPersonaje, #bAlbum { font-size: 16px; }

  /* Pase del Arca */
  #pase { background: linear-gradient(#312e81, #6d28d9); color: #fff; gap: 12px; }
  #pase h2 { text-shadow: 0 3px 0 #0004; }
  #paseInfo { display: flex; align-items: center; gap: 12px; font-weight: 800; background: #0003; padding: 8px 16px 8px 8px; border-radius: 999px; }
  #pista { display: flex; gap: 12px; overflow-x: auto; width: 100%; max-width: 1100px; padding: 14px 8px 18px; scroll-snap-type: x proximity; }
  .nivelP { flex: none; width: 104px; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .nivelP .n { font-weight: 900; font-size: 15px; background: #0003; border-radius: 999px; padding: 2px 10px; }
  .nivelP button { width: 104px; height: 124px; border-radius: 20px; background: linear-gradient(#a78bfa, #7c3aed); font-size: 52px; display: grid; place-items: center; box-shadow: 0 6px 0 #0004; position: relative; }
  .nivelP.bloq button { filter: grayscale(.8) brightness(.75); }
  .nivelP.bloq button::after { content: '🔒'; position: absolute; right: 6px; top: 4px; font-size: 18px; }
  .nivelP.listo button { background: linear-gradient(#fde047, #f59e0b); animation: pulsa 1s infinite; }
  .nivelP.listo button::after { content: '🎁'; position: absolute; right: 4px; top: 2px; font-size: 22px; }
  .nivelP.tuyo button::after { content: '✓'; position: absolute; right: 6px; top: 6px; font-size: 16px; font-weight: 900; color: #fff; background: #22c55e; border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; }
  .nivelP.aqui .n { background: #fde047; color: #1e1b4b; }
  .nivelP small { font-weight: 700; font-size: 12px; text-align: center; opacity: .9; }
  #paseAyuda { font-weight: 700; text-align: center; max-width: 600px; }
  #premio .tarjeta { background: radial-gradient(#fef9c3, #fde047 45%, #f59e0b); overflow: hidden; }
  #premio .tarjeta > :not(#rayos) { position: relative; }
  #rayos { position: absolute; inset: -60%; background: repeating-conic-gradient(#fff7 0 10deg, transparent 10deg 20deg); animation: gira 9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  #premioEmo { font-size: clamp(100px, 28vmin, 180px); line-height: 1.1; animation: aparece .7s cubic-bezier(.3, 1.6, .6, 1); }
  @keyframes aparece { from { transform: scale(0) rotate(-30deg); } }
  #explorador { font-size: clamp(30px, 7vmin, 50px); }
  .mascotaMundo { position: absolute; left: 92%; bottom: -6%; line-height: 1; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111d; color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; z-index: 40; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; max-width: 90vw; }
  #toast.ver { opacity: 1; }
</style>
</head>
<body>
<header id="barra">
  <button id="bInicio" class="chip" title="Inicio">🚢</button>
  <span class="chip" id="cEstrellas">⭐ 0</span>
  <span class="chip" id="cTablas">🪵 0/10</span>
  <button class="chip" id="cNivel" title="Pase del Arca">🎫 1</button>
  <span class="espacio"></span>
  <button id="candado" class="chip" title="Mantén presionado 3 segundos">🔒</button>
</header>

<section id="inicio" class="pantalla activa">
  <div id="lobby">
    <div id="lobbyCab">
      <h1 id="titulo">El Arca</h1>
      <button id="bPase"><span class="nv">1</span><span class="xpbar"><span></span></span><span class="lbl"></span></button>
    </div>
    <div id="escenario">
      <div id="isla">
        <div id="estelaLobby"></div>
        <button id="avLobby" aria-label="Bailar"><span id="avAnim"></span></button>
        <button id="mascotaLobby" aria-label="Mascota"></button>
        <span id="emoteIco"></span>
      </div>
      <div id="emotes" class="fila-botones"></div>
      <div class="fila-botones">
        <button id="bPersonaje" class="medio">👕 <span class="lbl"></span></button>
        <button id="bAlbum" class="medio">🏆 <span class="lbl"></span></button>
      </div>

const lenguasMsg = () => E.idioma === 'ambos' ? ['es', 'en'] : [E.idioma];

// ---------- Pase del Arca: niveles con XP y un premio por nivel (sin compras, todo se gana jugando) ----------
const BAILES = {

const PASE = [   // PASE[n - 1] es el premio del nivel n (el nivel 1 es el inicio)
  null,
  { t: 'mascota', v: '🐶' }, { t: 'baile', v: 'baile' },    { t: 'cara', v: '🧑‍🚀' },   { t: 'estela', v: '✨' },

];
const NIVEL_MAX = PASE.length;
const NUEVO = { mascota: ['¡Nueva mascota!', 'New pet!'], baile: ['¡Nuevo baile!', 'New dance!'], cara: ['¡Nueva cara!', 'New face!'],

const emoPremio = p => p.t === 'baile' ? BAILES[p.v].emo : p.v;

function ganarXP(n) {

  if (ahora > antes) {

let reto = null, turnoLengua = 0;

const numOpciones = () => E.nivel + 1;                 // 2, 3 o 4
const maxContar = () => [3, 5, 8][E.nivel - 1];
function abrirReto(arbusto) {
  const a = arbusto.animal, l = lenguaReto(), tipo = Math.random() < 0.5 ? 'letra' : 'contar';
  reto = { arbusto, a, l, tipo, intentos: 0 };
  const ver = $('retoVer'), opc = $('retoOpciones');
  opc.innerHTML = '';
  if (tipo === 'letra') {

    ver.innerHTML = `<div class="animal-grande">${a.emo}</div><div class="palabra">${resaltar ? `<b>${palabra[0]}</b>${palabra.slice(1)}` : palabra}</div>`;
    const otras = mezclar([...LETRAS].filter(c => c !== letra)).slice(0, numOpciones() - 1);
    mezclar([letra, ...otras]).forEach(c => opc.appendChild(botonOpcion(c, c === letra)));
    reto.pregunta = l === 'es' ? `${palabra}. ¡Toca la ${letra}!` : `${palabra}. Tap the ${letra}!`;
    $('retoPregunta').textContent = l === 'es' ? `Toca la letra ${letra}` : `Tap the letter ${letra}`;
  } else {
    const n = 1 + azar(maxContar());
    reto.respuesta = n;
    ver.innerHTML = '<div class="contables"></div>';
    let contados = 0;
    for (let k = 0; k < n; k++) {
      const c = document.createElement('button');
      c.className = 'contable'; c.textContent = a.emo;
      c.onclick = () => {   // tocar cada animal lo cuenta en voz alta
        if (c.querySelector('.num')) return;
        contados++; c.insertAdjacentHTML('beforeend', `<span class="num">${contados}</span>`);
        sfx.pop(); decir([{ l, t: String(contados) }]);
      };
      ver.firstChild.appendChild(c);
    }
    const cerca = [];
    for (let d = 1; cerca.length < 6; d++) { if (n - d >= 1) cerca.push(n - d); if (n + d <= Math.max(maxContar(), 3)) cerca.push(n + d); if (d > 8) break; }
    const otras = mezclar(cerca).slice(0, numOpciones() - 1);
    mezclar([n, ...otras]).forEach(v => opc.appendChild(botonOpcion(v, v === n, v <= 5 ? '●'.repeat(v) : '')));
    const plural = n === 1 ? a[l][0].toLowerCase() : a[l][1];
    const cuantos = a.g === 'f' ? 'Cuántas' : 'Cuántos';
    reto.pregunta = l === 'es' ? `¿${cuantos} ${a[l][1]}? ¡Tócal${a.g === 'f' ? 'a' : 'o'}s!` : `How many ${a[l][1]}? Tap them!`;
    reto.plural = plural;
    $('retoPregunta').textContent = l === 'es' ? `¿${cuantos} hay?` : `How many?`;
  }
  $('reto').classList.add('abierta');
  decir([{ l, t: reto.pregunta }]);
}
function botonOpcion(valor, correcta, puntos = '') {

function responder(b, correcta) {

    cx.font = `900 ${Math.max(18, TS * 0.45)}px ${EMOJI}`; cx.lineWidth = 4; cx.strokeStyle = '#0006';
    cx.strokeText(t.t, sx(t.x), sy(t.y)); cx.fillStyle = t.col; cx.fillText(t.t, sx(t.x), sy(t.y));
  }
  cx.globalAlpha = 1;
  cx.restore();
}
function bucleObra(t) {
  if (!enObra) return;
  const dt = Math.min(0.05, (t - tAnterior) / 1000 || 0); tAnterior = t;
  moverMono(dt); autoConstruir(dt); sembrarPremios(dt); recogerPremios(); moverPaseantes(dt);
  if (mono.emote && (mono.emote.t += dt) > 1.4) mono.emote = null;
  moverMascota(dt); moverEstela(dt);
  dibujarObra(dt);
  requestAnimationFrame(bucleObra);
}

// ---------- La mascota sigue al monito y la estela deja chispas al caminar ----------
const mascota = { x: MARGEN - 4, y: 0, dir: 1, salto: 0 };
const vuela = e => e === '🦜' || e === '🕊️';
const altoMascota = () => vuela(E.mascota) ? 1.4 : 0.3;
function moverMascota(dt) {
  if (!E.mascota) return;
  const meta = mono.x - mono.mira * 0.9;
  if (Math.abs(meta - mascota.x) > 8) { mascota.x = meta; mascota.y = mono.y; }
  const vx = (meta - mascota.x) * Math.min(1, dt * 3);
  if (Math.abs(vx) > 0.002) mascota.dir = Math.sign(vx);
  mascota.x += vx; mascota.y += (mono.y - mascota.y) * Math.min(1, dt * 4);
  mascota.salto = Math.max(0, mascota.salto - dt * 2);
}
function dibujarMascota(ahora) {
  if (!E.mascota) return;
  const bote = vuela(E.mascota) ? Math.sin(ahora * 4) * 0.15 : Math.abs(Math.sin(ahora * 9)) * (mono.vx ? 0.15 : 0.03);
  cx.save(); cx.translate(sx(mascota.x), sy(mascota.y + altoMascota() + bote + Math.sin(mascota.salto * Math.PI) * 0.8));
  if (mascota.dir > 0) cx.scale(-1, 1);
  emoji(E.mascota, 0, 0, TS * 0.6); cx.restore();
}
function tocarMascota(px, py) {
  if (!E.mascota) return false;
  const wx = px / TS + camX, wy = (baseY - py) / TS;
  if (Math.hypot(wx - mascota.x, wy - mascota.y - altoMascota()) > 0.7) return false;
  mascota.salto = 1; acariciar(); flotar('💗', mascota.x, mascota.y + altoMascota() + 0.6);
  return true;
}
let chispas = [], tChispa = 0;
function moverEstela(dt) {
  chispas = chispas.filter(c => (c.vida -= dt) > 0);
  if (!E.estela || !(mono.vx || !mono.suelo || mono.emote) || (tChispa -= dt) > 0) return;
  tChispa = 0.07;
  chispas.push({ x: mono.x - mono.mira * 0.25 + (Math.random() - 0.5) * 0.3, y: mono.y + 0.2 + Math.random() * 0.7, vida: 0.7, h: (performance.now() / 3) % 360 });
}
function dibujarEstela() {
  for (const c of chispas) {
    cx.globalAlpha = Math.min(1, c.vida * 1.6);
    if (E.estela === '🌈') { cx.fillStyle = `hsl(${c.h} 90% 60%)`; cx.beginPath(); cx.arc(sx(c.x), sy(c.y), TS * 0.1, 0, 7); cx.fill(); }
    else emoji(E.estela, sx(c.x), sy(c.y), TS * 0.28 * (0.5 + c.vida));
  }
  cx.globalAlpha = 1;
}

// ---------- Construir: el monito construye al pasar, o tocando el plano ----------
let tSonido = 0, tAvisoMadera = 0, misionDicha = -1, tAuto = 0, combo = 0, tCombo = 0, sacudida = 0, textos = [];
const NOTAS_COMBO = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const pendiente = (p, m) => m.brea ? llevaBrea(p) && !p.brea : p.m === E.mision && !p.hecho;
function piezaCerca(wx, wy, rx, ry = rx) {   // la pieza pendiente de la misión más cercana, dentro de un óvalo rx × ry
  const m = MISIONES[E.mision]; if (!m) return null;
  let mejor = null, dmin = 1;
  for (const p of PLANO) {
    if (!pendiente(p, m)) continue;
    const b = caja(p), d = Math.hypot((b.x + b.w / 2 - wx) / rx, (b.y + b.h / 2 - wy) / ry);
    if (d < dmin) { dmin = d; mejor = p; }
  }
  return mejor;
}
function flotar(t, x, y, col = '#fff') { textos.push({ t, x, y, col, vida: 1 }); }
function ponerPieza(p) {
  const m = MISIONES[E.mision], [hAntes, total] = avanceMision(E.mision);
  if (m.brea) p.brea = true;
  else {
    if (E.madera <= 0) { sinMadera(); return false; }
    p.hecho = true; E.madera--;
    const b = caja(p);   // no dejar al monito atorado dentro de lo que se acaba de construir
    if (solida(p) && mono.x + mono.w / 2 > b.x && mono.x - mono.w / 2 < b.x + b.w && mono.y < b.y + b.h && mono.y + mono.h > b.y) {
      if (b.h < 0.5) { mono.y = b.y + b.h; mono.vy = 0; }                                       // piso o techo: queda encima
      else mono.x = mono.x < b.x + b.w / 2 ? b.x - mono.w / 2 - 0.01 : b.x + b.w + mono.w / 2 + 0.01;   // pared: a un lado
    }
  }
  const b = caja(p), ahora = performance.now();
  for (let k = 0; k < 6; k++) astillas.push({ x: b.x + 0.5, y: b.y + b.h, vx: (Math.random() - 0.5) * 5, vy: 2 + Math.random() * 4, vida: 0.6, col: m.brea ? '#1c130d' : ['#c08a5a', '#fcd34d', '#a0632e'][k % 3] });
  // Combo: cada pieza seguida suena una nota más aguda
  combo = ahora - tCombo < 1200 ? combo + 1 : 1; tCombo = ahora;
  if (ahora - tSonido > 70) {
    tono(NOTAS_COMBO[Math.min(combo - 1, NOTAS_COMBO.length - 1)], 0, 0.15, 'triangle', 0.12);
    if (!m.brea) tono(110, 0, 0.06, 'square', 0.06);
    tSonido = ahora;
  }
  if (combo >= 5 && combo % 5 === 0) flotar(`🔥 x${combo}`, mono.x, mono.y + 2, '#fde047');
  sacudida = 0.12;
  ganarXP(1); evento('pieza');
  // Mini festejo cada 25 % de la misión
  const h = hAntes + 1;
  if (h < total && Math.floor(h / total * 4) > Math.floor(hAntes / total * 4)) {
    E.estrellas++; animo(); sfx.bien();
    flotar('+1 ⭐', mono.x, mono.y + 2.2, '#fde047');
    for (let k = 0; k < 14; k++) astillas.push({ x: mono.x, y: mono.y + 1, vx: (Math.random() - 0.5) * 8, vy: 3 + Math.random() * 5, vida: 0.9, col: ['#fde047', '#f472b6', '#60a5fa', '#4ade80'][k % 4] });
  }
  pintarMision();
  if (h === total) completarMision(); else if (h % 10 === 0) guardarObra();
  return true;
}
function construirEn(px, py) {
  const p = piezaCerca(px / TS + camX, (baseY - py) / TS, 1);
  if (p) ponerPieza(p);
}
function autoConstruir(dt) {   // el monito martilla lo que tiene cerca, también el piso que tiene encima
  if ((tAuto -= dt) > 0) return;
  const p = piezaCerca(mono.x, mono.y + 0.65, 1.25, 1.9);
  if (!p) return;
  tAuto = ponerPieza(p) ? 0.12 : 0.6;
}

// ---------- Mundo vivo: premios flotantes, animales y nubes ----------
let premios = [], paseantes = [], tPremio = 0;
function sembrarPremios(dt) {
  if ((tPremio -= dt) > 0 || premios.length >= 6) return;
  tPremio = 2.5;
  const dentro = E.mision >= 2 && Math.random() < 0.6;   // con pisos hechos, también aparecen dentro del arca
  const piso = [0.2, 2.2, 4.2][azar(3)];
  const x = dentro ? MARGEN + 2 + Math.random() * (COLS - 4) : MARGEN - 8 + Math.random() * (COLS + 16);
  const y = (dentro ? piso : 0) + [0.9, 1.6, 2.2][azar(dentro ? 2 : 3)];
  premios.push({ x, y, tipo: Math.random() < 0.3 ? 'madera' : 'estrella', fase: Math.random() * 6 });
}
function recogerPremios() {
  const cxm = mono.x, cym = mono.y + 0.65;
  premios = premios.filter(pr => {
    if (Math.hypot(pr.x - cxm, pr.y - cym) > 0.8) return true;
    if (pr.tipo === 'estrella') { E.estrellas++; flotar('+1 ⭐', pr.x, pr.y + 0.5, '#fde047'); tono(1319, 0, 0.12, 'sine', 0.12); tono(1760, 0.08, 0.18, 'sine', 0.12); }
    else { E.madera += 3; flotar('+3 🪵', pr.x, pr.y + 0.5, '#fbbf24'); tono(784, 0, 0.1, 'triangle', 0.12); tono(1047, 0.08, 0.15, 'triangle', 0.12); }
    ganarXP(3); evento('premio'); pintarMision(); return false;
  });
}
function prepararPaseantes() {   // los animales rescatados esperan y caminan junto al arca
  const ids = ANIMALES.filter(a => E.coleccion[a.id]);
  paseantes = ids.slice(-8).map((a, k) => ({ a, x: MARGEN + COLS + 1.5 + k * 1.1, dir: Math.random() < 0.5 ? -1 : 1, salto: 0 }));
}
function moverPaseantes(dt) {
  for (const p of paseantes) {
    p.x += p.dir * 0.6 * dt;
    if (p.x < MARGEN + COLS + 1 || p.x > MUNDO_W - 0.6) p.dir *= -1;
    if (Math.random() < dt * 0.15) p.dir *= -1;
    p.salto = Math.max(0, p.salto - dt * 2);
  }
}
function tocarPaseante(px, py) {
  const wx = px / TS + camX, wy = (baseY - py) / TS;
  const p = paseantes.find(p => Math.abs(p.x - wx) < 0.6 && wy < 1.4 && wy > -0.2);
  if (!p) return false;
  p.salto = 1; sfx.pop(); di(p.a.es[0], p.a.en[0]);
  return true;
}
function sinMadera() {
  const ahora = performance.now();
  if (ahora - tAvisoMadera < 4000) return;
  tAvisoMadera = ahora;
  toast(T('🪵 ¡Se acabó la madera! Rescata animales para conseguir más.', '🪵 Out of wood! Rescue animals to get more.'));
  di('¡Se acabó la madera! Rescata animales para conseguir más.', 'Out of wood! Rescue animals to get more.');
  $('bIrRescatar').classList.add('pulsa');
}
function completarMision() {
  const hecha = MISIONES[E.mision];
  E.mision++; E.estrellas += 5; guardarObra(); ganarXP(50); sfx.fanfarria();
  toast(T(`✅ ¡${hecha.tit[0]}: listo! +5 ⭐ +50 XP`, `✅ ${hecha.tit[1]}: done! +5 ⭐ +50 XP`));
  pintarMision();
  if (E.mision >= MISIONES.length) { setTimeout(finalArca, 1500); return; }
  setTimeout(decirMision, 1600);
}
function decirMision() { const m = MISIONES[E.mision]; if (m) { misionDicha = E.mision; di(...m.corto); } }
function pintarMision() {
  const m = MISIONES[E.mision], tarjeta = $('mision');
  barra();
  if (!m) {
    tarjeta.querySelector('.ref').textContent = FIN_OBRA.ref;
    tarjeta.querySelector('.tit').textContent = T('🌈 ¡Arca terminada!', '🌈 Ark finished!');
    tarjeta.querySelector('.barraAv span').style.width = '100%';
    tarjeta.querySelector('.cuenta').textContent = T('Noé hizo todo lo que Dios le mandó.', 'Noah did everything God commanded him.');
    return;
  }
  const [h, t] = avanceMision(E.mision);
  tarjeta.querySelector('.ref').textContent = `📜 ${m.ref} · ${T('Misión', 'Mission')} ${E.mision + 1}/${MISIONES.length}`;
  tarjeta.querySelector('.tit').textContent = T(m.tit[0], m.tit[1]);
  tarjeta.querySelector('.barraAv span').style.width = (h / t * 100) + '%';
  tarjeta.querySelector('.cuenta').textContent = `${h} / ${t}` + (m.brea ? '  ⚫ ' + T('camina o toca para pintar', 'walk or tap to paint') : `  ·  🪵 ${E.madera}  ·  ` + T('🐵 camina cerca o toca', '🐵 walk near or tap'));
}
let dedoAbajo = false;
lienzo.addEventListener('pointerdown', e => {
  audio();
  if (tocarMascota(e.clientX, e.clientY) || tocarPaseante(e.clientX, e.clientY)) return;
  dedoAbajo = true; lienzo.setPointerCapture?.(e.pointerId); construirEn(e.clientX, e.clientY);
});
lienzo.addEventListener('pointermove', e => { if (dedoAbajo) construirEn(e.clientX, e.clientY); });
const soltarDedo = () => { if (dedoAbajo) { dedoAbajo = false; guardarObra(); } };
['pointerup', 'pointercancel'].forEach(t => lienzo.addEventListener(t, soltarDedo));

// Botones y teclado para mover al monito
document.querySelectorAll('#mandos [data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audio(); teclas[k] = true; if (k === 'arriba') teclas.saltar = true; b.classList.add('on'); };
  const off = () => { teclas[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, off));
});
const MAPA_TECLAS = { ArrowLeft: 'izq', KeyA: 'izq', ArrowRight: 'der', KeyD: 'der', ArrowUp: 'arriba', KeyW: 'arriba', Space: 'arriba', ArrowDown: 'abajo', KeyS: 'abajo' };
addEventListener('keydown', e => {
  const k = MAPA_TECLAS[e.code]; if (!k || !enObra) return;
  e.preventDefault(); if (k === 'arriba' && !e.repeat) teclas.saltar = true; teclas[k] = true;
});
addEventListener('keyup', e => { const k = MAPA_TECLAS[e.code]; if (k) teclas[k] = false; });
$('bVista').onclick = () => { vista = !vista; $('bVista').classList.toggle('on', vista); medirObra(); };
$('bBaile').onclick = () => bailar(bailesMios().includes(E.baileFav) ? E.baileFav : 'saludo', true);
$('bIrRescatar').onclick =() => { $('bIrRescatar').classList.remove('pulsa'); entrarMundo(); };
$('misionOir').onclick = () => { const m = MISIONES[E.mision]; m ? di(m.es, m.en) : di(FIN_OBRA.es, FIN_OBRA.en); };

function entrarObra() {
  mostrar('obra'); pintarMision(); medirObra(); prepararPaseantes();
  camX = vista ? MARGEN - 1 : Math.max(0, mono.x - W2 / TS / 2);
  requestAnimationFrame(t => { tAnterior = t; bucleObra(t); });
  if (misionDicha !== E.mision) decirMision();
}

// ---------- Ajustes para adultos (mantener 🔒 3 segundos) ----------
const bCand = $('candado');
let tCand = null;
bCand.addEventListener('pointerdown', () => {
  bCand.classList.add('cargando');
  tCand = setTimeout(() => { tCand = null; bCand.classList.remove('cargando'); abrirPanel(); }, 3000);
});
const soltarCandado = () => { if (tCand) { clearTimeout(tCand); tCand = null; bCand.classList.remove('cargando'); } };
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => bCand.addEventListener(t, soltarCandado));
addEventListener('contextmenu', e => e.preventDefault());

function radios(cont, nombre, opciones, actual, alCambiar) {
  cont.innerHTML = '';
  for (const [v, txt] of opciones) {
    const d = document.createElement('div');
    d.className = 'opc';
    d.innerHTML = `<input type="radio" name="${nombre}" id="${nombre}-${v}" ${String(actual) === String(v) ? 'checked' : ''}><label for="${nombre}-${v}">${txt}</label>`;
    d.querySelector('input').onchange = () => alCambiar(v);
    cont.appendChild(d);
  }
}
function abrirPanel() {
  $('nombre').value = E.nombre;
  radios($('pIdioma'), 'idioma', [['es', 'Español'], ['en', 'English'], ['ambos', 'Bilingüe (español + English)']], E.idioma, v => { E.idioma = v; guardar(); });
  radios($('pNivel'), 'nivel', [[1, 'Fácil'], [2, 'Medio'], [3, 'Difícil']], E.nivel, v => { E.nivel = Number(v); guardar(); });
  $('panel').classList.add('abierta');
}
$('nombre').oninput = () => { E.nombre = $('nombre').value; guardar(); };
$('bCerrarPanel').onclick = () => {
  $('panel').classList.remove('abierta');
  pintarInicio(); mostrar('inicio');
};
$('bReiniciar').onclick = () => {
  if (!confirm('¿Borrar estrellas, animales, el arca construida y los premios? Esto no se puede deshacer.')) return;
  const { nombre, idioma } = E;
  E = { ...JSON.parse(JSON.stringify(DEF)), nombre, idioma };
  PLANO.forEach(p => { p.hecho = false; p.brea = false; });
  Object.assign(mono, { x: MARGEN - 3, y: 0, vx: 0, vy: 0 });
  arbustos.forEach(b => b.el.remove()); arbustos = [];
  guardar(); $('panel').classList.remove('abierta'); pintarInicio(); mostrar('inicio');
};
function cerrarCapas() { ['reto', 'festejo', 'premio'].forEach(id => $(id).classList.remove('abierta')); reto = null; ocupado = false; }

pintarInicio();
</script>
